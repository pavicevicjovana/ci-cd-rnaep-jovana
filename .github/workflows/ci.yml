name: CI
#ovo je fajl koji ce da pokrene testove koje smo napisali
#kroz github actions
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name : Install dependencies
        run : |
          python -m pip install --upgrade pip
          pip install -r ./inventory/requirements.txt
      - name : Run rests
        run: | 
          PYTHONPATH=./inventory/ pytest

